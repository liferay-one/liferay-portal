assemble:
    -   from: batch
        into: batch
liferay-one-salesforce-product-batch:
    name: Liferay One Salesforce Product Batch
    oAuthApplicationHeadlessServer: liferay-one-salesforce-product-batch-oahs
    type: batch
liferay-one-salesforce-product-batch-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay One Salesforce Product Batch OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Headless.Commerce.Admin.Catalog.everything
    type: oAuthApplicationHeadlessServer