_format_version: "3.0"
services:
    -   name: health
        routes:
            -   methods:
                    -   GET
                name: health
                paths:
                    -   ~/$
                plugins:
                    -   config:
                            status_code: 200
                        name: request-termination
        url: http://localhost:8100
    -   name: provisioning-uat
        routes:
            -   methods:
                    -   POST
                name: cloud-environment-activate
                paths:
                    -   ~/cloud/v1/environments/(?<environment_id>[^/]+)/activation$
                plugins:
                    -   config:
                            replace:
                                uri: /o/provisioning-rest/v1.0/cloud/environments/$(uri_captures["environment_id"])/activation
                        name: request-transformer
            -   methods:
                    -   POST
                name: cloud-environment-manifest
                paths:
                    -   ~/cloud/v1/environments/(?<environment_id>[^/]+)/manifest$
                plugins:
                    -   config:
                            replace:
                                uri: /o/provisioning-rest/v1.0/cloud/environments/$(uri_captures["environment_id"])/manifest
                        name: request-transformer
        url: https://webserver-lrprovisioning-uat.lfr.cloud