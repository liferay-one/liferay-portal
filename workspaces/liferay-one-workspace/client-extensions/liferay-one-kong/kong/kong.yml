_format_version: "3.0"
services:
    -   name: health
        routes:
            -   methods:
                    -   GET
                name: health
                paths:
                    -   ~/$
                plugins:
                    -   config:
                            status_code: 200
                        name: request-termination
        url: http://localhost:8100
    -   name: liferay-one-etc-spring-boot
        routes:
            -   methods:
                    -   POST
                name: cloud-environment-activate
                paths:
                    -   ~/cloud/v1/environments/(?<environment_id>[^/]+)/activation$
                plugins:
                    -   config:
                            replace:
                                uri: /cloud/environments/$(uri_captures["environment_id"])/activation
                        name: request-transformer
            -   methods:
                    -   POST
                name: cloud-environment-manifest
                paths:
                    -   ~/cloud/v1/environments/(?<environment_id>[^/]+)/manifest$
                plugins:
                    -   config:
                            replace:
                                uri: /cloud/environments/$(uri_captures["environment_id"])/manifest
                        name: request-transformer
            -   methods:
                    -   POST
                name: cloud-product-virtual-entry-download
                paths:
                    -   ~/cloud/products/[^/]+/virtual-entry/[^/]+/download$
                strip_path: false
        url: __SPRING_BOOT_URL__