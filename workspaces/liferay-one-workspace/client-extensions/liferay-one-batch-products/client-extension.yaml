assemble:
    -   from: batch
        into: batch
liferay-one-batch-products:
    name: Liferay One Batch Products
    oAuthApplicationHeadlessServer: liferay-one-batch-products-oahs
    type: batch
liferay-one-batch-products-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay One Batch Products OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Headless.Commerce.Admin.Catalog.everything
        -   c_entitlementdefinition.everything
        -   c_entitlementdefinitionsku.everything
        -   c_usagedefinition.everything
    type: oAuthApplicationHeadlessServer