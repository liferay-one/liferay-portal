assemble:
    -   fromTask: bootJar
liferay-one-etc-spring-boot-oahs:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay One Etc Spring Boot OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.Address.everything.read
        -   Liferay.Headless.Admin.List.Type.everything.read
        -   Liferay.Headless.Admin.User.everything
        -   Liferay.Headless.Commerce.Admin.Account.everything
        -   Liferay.Headless.Commerce.Admin.Catalog.everything
        -   Liferay.Headless.Commerce.Admin.Channel.everything.read
        -   Liferay.Headless.Commerce.Admin.Order.everything
        -   Liferay.Headless.Commerce.Admin.Pricing.everything
        -   Liferay.Notification.REST.everything
        -   c_accountinvitation.everything
        -   c_activationkey.everything
        -   c_commonlicensekey.everything
        -   c_contract.everything
        -   c_entitlement.everything
        -   c_entitlementdefinition.everything
        -   c_entitlementdefinitionsku.everything
        -   c_environment.everything
        -   c_environmentadmin.everything
        -   c_licensekey.everything
        -   c_productversion.everything
        -   c_project.everything
        -   c_projectmembership.everything
        -   c_property.everything
        -   c_subscriptionentry.everything
        -   c_ticketattachment.everything
        -   c_trialextensionrequest.everything
        -   c_usagedefinition.everything.read
        -   c_usagereport.everything
    type: oAuthApplicationHeadlessServer
liferay-one-etc-spring-boot-oaua:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay One Etc Spring Boot OAuth Application User Agent
    scopes:
        -   Liferay.Headless.Admin.User.everything
        -   c_activationkey.everything.read
        -   c_environment.everything.read
        -   c_licensekey.everything.read
        -   c_project.everything.read
        -   c_projectmembership.everything
        -   c_subscriptionentry.everything
        -   c_ticketattachment.everything
    type: oAuthApplicationUserAgent
liferay-one-etc-spring-boot-object-action-account-create:
    name: Liferay One Etc Spring Boot Object Action Account Create
    oAuth2ApplicationExternalReferenceCode: liferay-one-etc-spring-boot-oaua
    resourcePath: /object/action/account/create
    type: objectAction
